name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Default to read-only; the build job elevates to contents: write below
# because it is the only job that creates a GitHub Release.
permissions:
  contents: read

jobs:
  test:
    name: Scanner tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile + run scanner tests
        run: npm test

  build:
    name: Build VSIX
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed by softprops/action-gh-release to create the release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Pinned, and the modern package name. The old unscoped `vsce` is
      # deprecated, and leaving it unpinned meant the job that BUILDS the
      # artefact ran whatever version npm served that day, while the job that
      # publishes it was carefully pinned. The build step is the one that
      # decides what ends up in the VSIX, so it matters at least as much.
      - name: Package extension
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "Quell v${{ steps.version.outputs.VERSION }}"
          body: |
            See [CHANGELOG.md](https://github.com/sonofg0tham/Quell/blob/main/CHANGELOG.md)
            for what's changed in this release.
          files: "quell-${{ steps.version.outputs.VERSION }}.vsix"
          draft: false
          prerelease: false

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: "quell-${{ steps.version.outputs.VERSION }}.vsix"

  publish-marketplaces:
    # Publishes the VSIX to the VS Code Marketplace and Open VSX.
    # Only runs once BOTH are true:
    #   1. The repo variable MARKETPLACE_READY is 'true'
    #      (gh variable set MARKETPLACE_READY --body true)
    #   2. The VSCE_PAT and OVSX_PAT secrets exist:
    #      - VSCE_PAT: Azure DevOps PAT with Marketplace > Manage scope
    #        (https://dev.azure.com > User settings > Personal access tokens)
    #      - OVSX_PAT: token from https://open-vsx.org/user-settings/tokens
    # Until then this job is skipped so tag pushes never fail.
    name: Publish to VS Marketplace + Open VSX
    if: vars.MARKETPLACE_READY == 'true'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      # Publish tools are version-pinned so a compromised "latest" release of
      # either package can never run inside this job, which holds the PATs.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath quell-*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.0.2 publish quell-*.vsix --pat "$OVSX_PAT"
