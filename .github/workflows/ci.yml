name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Scanner tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Compile + run scanner tests
        run: npm test

      - name: Claude plugin hook tests
        working-directory: packages/claude-plugin
        run: npm test

      - name: Install scanner dev dependencies
        working-directory: packages/scanner
        run: npm ci

      - name: Verify plugin scanner copy is not stale
        working-directory: packages/claude-plugin
        run: npm run bundle-scanner && git diff --exit-code scanner/
